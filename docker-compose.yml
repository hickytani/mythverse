version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mythverse_postgres
    restart: always
    environment:
      POSTGRES_USER: mythuser
      POSTGRES_PASSWORD: my-worldos-password-123
      POSTGRES_DB: mythverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mythverse_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mythuser:my-worldos-password-123@postgres:5432/mythverse_db
      JWT_SECRET: mythverse-super-secret-jwt-key-2026
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mythverse_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
